services:
  # All secrets are defined as environment variable substitutions.
  # For local dev, set the required variables in .env (already in .gitignore).
  # For production, use Docker secrets or a secrets manager instead.

  redis:
    image: redis:7-alpine
    container_name: de_copilot_broker
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-local_secure_password_123}"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    ports:
      - "6379:6379"
    networks:
      - de_copilot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-local_secure_password_123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: de_copilot_vectorstore
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - de_copilot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: de_copilot_minio
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"
      - "9001:9001"
    networks:
      - de_copilot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: de_copilot_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/local-dev;
      exit 0;
      "
    networks:
      - de_copilot_net

  ollama:
    image: ollama/ollama:0.32.4
    container_name: de_copilot_ollama
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-32}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    networks:
      - de_copilot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: de_copilot_clickhouse
    cap_add:
      - SYS_NICE
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local_secure_password_123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - de_copilot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  langfuse-postgres:
    image: postgres:16-alpine
    container_name: de_copilot_langfuse_db
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASSWORD:-local_secure_password_123}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - de_copilot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  langfuse:
    image: langfuse/langfuse:3
    container_name: de_copilot_observability
    depends_on:
      - langfuse-postgres
      - clickhouse
      - minio
      - minio-init
      - redis
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_PG_PASSWORD:-local_secure_password_123}@langfuse-postgres:5432/langfuse
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-secret_string_minimum_32_characters_long}
      - NEXTAUTH_URL=http://localhost:3000
      - SALT=${LANGFUSE_SALT:-salt_string}
      - "ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY_64_hex_generate_with_openssl_rand_-hex_32}"
      - LANGFUSE_HOST=http://langfuse:3000
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-local_secure_password_123}
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=local-dev
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - REDIS_URL=redis://:${REDIS_PASSWORD:-local_secure_password_123}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_PASSWORD:-local_secure_password_123}
      - REDIS_TLS_ENABLED=false
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/public/health', r=>process.exit(r.statusCode===200?0:1))"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - de_copilot_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: de_copilot_postgres
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_secure_password_123}
      POSTGRES_DB: crawl_frontier
    volumes:
      - crawl_frontier_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - de_copilot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d crawl_frontier"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: de_copilot_langfuse_worker
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    depends_on:
      - langfuse-postgres
      - clickhouse
      - minio
      - minio-init
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_PG_PASSWORD:-local_secure_password_123}@langfuse-postgres:5432/langfuse
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-secret_string_minimum_32_characters_long}
      - NEXTAUTH_URL=http://localhost:3000
      - SALT=${LANGFUSE_SALT:-salt_string}
      - "ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY_64_hex_generate_with_openssl_rand_-hex_32}"
      - LANGFUSE_HOST=http://langfuse:3000
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-local_secure_password_123}
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=local-dev
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - REDIS_URL=redis://:${REDIS_PASSWORD:-local_secure_password_123}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_PASSWORD:-local_secure_password_123}
      - REDIS_TLS_ENABLED=false
      - HOSTNAME=0.0.0.0
    networks:
      - de_copilot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: de_copilot_base_image:${IMAGE_TAG:-latest}  # Git-SHA tagged via `make docker-dev`
    container_name: de_copilot_api
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    # Profile-gated: start with `--profile app`, or by name (`docker compose up backend-api`).
    # CI (`-f docker-compose.yml -f docker-compose.ci.yml`) omits the profile and skips this.
    profiles: ["app"]
    command: uvicorn data_engineering_copilot.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      langfuse:
        condition: service_healthy
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-local_secure_password_123}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - CRAWL_DB_URL=postgresql://copilot:${POSTGRES_PASSWORD:-local_secure_password_123}@postgres:5432/crawl_frontier
      - LOG_LEVEL=INFO
      - LANGFUSE_HOST=http://langfuse:3000
    networks:
      - de_copilot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  celery_worker:
    image: de_copilot_base_image:${IMAGE_TAG:-latest}  # Reuses backend-api build instantly
    container_name: de_copilot_celery_worker
    profiles: ["app"]  # See backend-api comment
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    command: celery -A data_engineering_copilot.workers.tasks worker -Q ingestion -c 1 --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; r=redis.Redis.from_url('redis://:${REDIS_PASSWORD:-local_secure_password_123}@redis:6379/0'); r.ping(); open('/proc/1/cmdline').read().find('celery') > -1 and exit(0) or exit(1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    shm_size: "2gb"
    depends_on:
      backend-api:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      langfuse:
        condition: service_healthy
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-local_secure_password_123}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - CRAWL_DB_URL=postgresql://copilot:${POSTGRES_PASSWORD:-local_secure_password_123}@postgres:5432/crawl_frontier
      - LOG_LEVEL=INFO
      - LANGFUSE_HOST=http://langfuse:3000
    networks:
      - de_copilot_net
    restart: unless-stopped

networks:
  de_copilot_net:
    driver: bridge

volumes:
  qdrant_storage:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  langfuse_pg_data:
  ollama_data:
  crawl_frontier_pg_data:
