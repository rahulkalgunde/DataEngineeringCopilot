name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.29"
  COMPOSE_PROJECT_NAME: dec_ci
  UV_PROJECT_ENVIRONMENT: dec_venv
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  LANGFUSE_ENCRYPTION_KEY: ${{ secrets.LANGFUSE_ENCRYPTION_KEY }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run make lint

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Unit Tests
        run: uv run make test-ci-unit

      - name: Upload coverage
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        if: always()
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  test-smoke:
    name: Smoke Test (gen-build → gen-validate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test-unit]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Start minimal stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d qdrant redis ollama
          sleep 10

      - name: Pull minimal models
        run: |
          docker exec de_copilot_ollama ollama pull nomic-embed-text
          docker exec de_copilot_ollama ollama pull llama3.2:3b

      - name: Run smoke generation
        run: |
          export UV_PROJECT_ENVIRONMENT=dec_venv
          uv run dec gen-manifest --generation smoke-test
          uv run dec gen-build --generation smoke-test
          uv run dec gen-validate --generation smoke-test
        env:
          UV_PROJECT_ENVIRONMENT: dec_venv

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  test-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: RAG Evaluation
        run: uv run make test-eval

      - name: Eval dataset schema gates
        run: uv run make test-eval-data

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test-unit]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Cache Ollama models
        id: ollama-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ollama_cache
          key: ollama-models-${{ hashFiles('ci/ollama-models.txt') }}
          restore-keys: |
            ollama-models-

      - name: Fix Ollama cache permissions
        run: mkdir -p .ollama_cache && sudo chown -R "$(whoami)" .ollama_cache

      - name: Start all service dependencies
        run: |
          # minio-init is a one-shot bucket-setup container that exits 0.
          # `compose up --wait` treats an exited container as unmet and
          # returns non-zero (same as make dev, which tolerates it too).
          # Capture its exit code, then assert every long-running service is
          # healthy so genuine failures fail the step. Only if the stack IS
          # healthy do we emit the expected-exit warning for that case.
          set +e
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait --wait-timeout 480
          compose_rc=$?
          set -e
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps --format '{{.Name}}\t{{.State}}\t{{.Health}}' | \
            grep -E 'de_copilot_(observability|vectorstore|broker|ollama|postgres|langfuse_db|minio|clickhouse)[[:space:]]+running[[:space:]]+healthy' || {
              echo "::error::one or more required services failed to become healthy"
              exit 1
            }
          if [ "$compose_rc" -ne 0 ]; then
            echo "::warning::compose up --wait returned non-zero (minio-init one-shot exit expected)"
          fi

      - name: Pull Ollama models
        run: |
          docker exec de_copilot_ollama ollama pull nomic-embed-text
          docker exec de_copilot_ollama ollama pull llama3.2:3b
          docker exec de_copilot_ollama ollama pull qwen2.5-coder:7b

      - name: Verify Ollama models
        run: |
          for model in nomic-embed-text llama3.2:3b qwen2.5-coder:7b; do
            docker exec de_copilot_ollama ollama list | grep -q "$model" || {
              echo "::error::missing ollama model $model"
              exit 1
            }
          done

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Integration Tests
        run: uv run make test-integration
        env:
          REQUIRE_INFRA: "1"

      - name: Save Ollama models cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.ollama-cache.outputs.cache-hit != 'true'
        with:
          path: .ollama_cache
          key: ollama-models-${{ hashFiles('ci/ollama-models.txt') }}

      - name: Stop services and restore cache ownership
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true
          sudo chown -R "$(whoami)" .ollama_cache 2>/dev/null || true

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test-unit]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Cache Ollama models
        id: ollama-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ollama_cache
          key: ollama-models-${{ hashFiles('ci/ollama-models.txt') }}
          restore-keys: |
            ollama-models-

      - name: Fix Ollama cache permissions
        run: mkdir -p .ollama_cache && sudo chown -R "$(whoami)" .ollama_cache

      - name: Start service dependencies
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait --wait-timeout 180 qdrant redis ollama

      - name: Pull Ollama models
        run: |
          docker exec de_copilot_ollama ollama pull nomic-embed-text
          docker exec de_copilot_ollama ollama pull llama3.2:3b
          docker exec de_copilot_ollama ollama pull qwen2.5-coder:7b

      - name: Verify Ollama models
        run: |
          for model in nomic-embed-text llama3.2:3b qwen2.5-coder:7b; do
            docker exec de_copilot_ollama ollama list | grep -q "$model" || {
              echo "::error::missing ollama model $model"
              exit 1
            }
          done

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: E2E Tests
        run: uv run make test-e2e
        env:
          REQUIRE_INFRA: "1"

      - name: Save Ollama models cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.ollama-cache.outputs.cache-hit != 'true'
        with:
          path: .ollama_cache
          key: ollama-models-${{ hashFiles('ci/ollama-models.txt') }}

      - name: Stop services and restore cache ownership
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true
          sudo chown -R "$(whoami)" .ollama_cache 2>/dev/null || true

  # Retrieval benchmark regression gate — runs on main branch and PRs
  # Fails if recall/MRR/precision regresses beyond configured thresholds
  eval-retrieval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test-unit]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Cache Ollama models
        id: ollama-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ollama_cache
          key: ollama-models-${{ hashFiles('ci/ollama-models.txt') }}
          restore-keys: |
            ollama-models-

      - name: Fix Ollama cache permissions
        run: mkdir -p .ollama_cache && sudo chown -R "$(whoami)" .ollama_cache

      - name: Start service dependencies (qdrant + redis + ollama)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait --wait-timeout 180 qdrant redis ollama

      - name: Pull Ollama models
        run: |
          docker exec de_copilot_ollama ollama pull nomic-embed-text
          docker exec de_copilot_ollama ollama pull llama3.2:3b
          docker exec de_copilot_ollama ollama pull qwen2.5-coder:7b

      - name: Verify Ollama models
        run: |
          for model in nomic-embed-text llama3.2:3b qwen2.5-coder:7b; do
            docker exec de_copilot_ollama ollama list | grep -q "$model" || {
              echo "::error::missing ollama model $model"
              exit 1
            }
          done

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run retrieval benchmark regression gate
        run: uv run make eval-retrieval-gate

      - name: Stop services and restore cache ownership
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true
          sudo chown -R "$(whoami)" .ollama_cache 2>/dev/null || true
