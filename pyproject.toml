[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-engineering-copilot"
version = "0.1.0"
description = "RAG-powered documentation assistant for data engineering frameworks"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "aiohttp>=3.9",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "markdownify>=0.12",
    "langchain-text-splitters>=0.3.0",
    "nltk>=3.8",
    "numpy>=1.26",
    "psutil>=5.9",
    "qdrant-client>=1.7",
    "fastapi>=0.110",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.27",
    "langfuse>=4.14,<5",
    "structlog>=24.1",
    "tiktoken>=0.7",
    "celery>=5.3",
    "redis>=5.0",
    "crawl4ai>=0.2",
    "docutils>=0.21",
    "sentence-transformers>=3.0",
    "json-repair==0.*",
    "streamlit>=1.31",
    "plotly>=5.24",
    "pydeck>=0.9",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.6",
    "pytest-sugar>=1.0",
    "pytest-rerunfailures>=14.0",
    "respx>=0.21",
    "aresponses>=3.0",
    "testcontainers[qdrant,redis,ollama]>=3.7",
    "ruff>=0.4",
    "pre-commit>=3.5",
    "watchfiles>=0.21",
    "ragas==0.3.9",
    "datasets>=4.0",
    "langchain-openai>=0.3,<2",
    "langchain-community>=0.3",
    "syrupy>=4.6",
    "segeval>=2.0.11",
    "markdown-it-py>=3.0",
    "tree-sitter>=0.20",
    "tree-sitter-python>=0.20",
    "diff-cover>=9.0",
    "mutmut>=3.0",
]
colbert = [
    # True neural late-interaction reranking (PyLate). Optional extra: NOT
    # installed in CI; enable locally with `uv pip install -e ".[colbert]"`.
    "pylate>=1.1",
]

[project.scripts]
dec = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["data_engineering_copilot"]

[tool.hatch.build.targets.wheel.force-include]
"data_engineering_copilot/evaluation/fast_sanity_pairs.jsonl" = "data_engineering_copilot/evaluation/fast_sanity_pairs.jsonl"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-n 6 --dist worksteal --strict-markers --timeout=60 --timeout-method=thread"
filterwarnings = [
    'ignore:Using `httpx` with `starlette.testclient` is deprecated',
    'ignore:coroutine .* was never awaited',
]
markers = [
    "unit: fast, isolated tests with mocked dependencies (safe to run with -n 6)",
    "integration: marks tests that require live external services (Qdrant, Ollama, Langfuse)",
    "slow: marks tests that take a long time to run",
    "qdrant: marks tests that require a running Qdrant instance",
    "ollama: marks tests that require a running Ollama instance",
    "langfuse: marks tests that require a running Langfuse instance",
    "rag: marks tests that exercise the full RAG pipeline (Qdrant + Ollama)",
    "ingestion: marks tests that exercise the full ingestion pipeline (Qdrant + Ollama)",
    "api: marks tests that exercise FastAPI endpoints (may require Celery/Redis)",
    "celery: marks tests that exercise Celery workers (requires Redis broker)",
    "e2e: marks end-to-end tests that require a full running Docker stack (Qdrant, Redis, Ollama, API)",
    "evaluation: marks tests that evaluate RAG quality with mocked embedder (no infra needed)",
    "xdist_group(name): tests sharing a resource that must run in the same worker process",
    "serial: tests that must not run in parallel with other tests (shared state)",
]

[tool.coverage.run]
parallel = true
branch = true
omit = ["data_engineering_copilot/ui/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["data_engineering_copilot"]

[tool.pyright]
typeCheckingMode = "basic" # Use "basic" for existing projects, "strict" ONLY for brand new code
reportMissingTypeStubs = false # Stops it from complaining about poorly-typed third-party libraries

[tool.mutmut]
# Scoped mutation testing: only critical pure-logic modules, run locally via
# `make mutate`. NOT in CI (runtime cost; CI stays hermetic and time-boxed).
source_paths = [
    "data_engineering_copilot/services/text_filter.py",
    "data_engineering_copilot/infrastructure/provider_capabilities.py",
    "data_engineering_copilot/services/prompt_injection.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_text_filter.py",
    "tests/unit/test_provider_capabilities.py",
    "tests/unit/test_input_guardrails.py",
]

