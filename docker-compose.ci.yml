# CI-only override layered on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait
#
# App services (backend-api, celery_worker) are profile-gated ("app") and therefore
# NOT started by CI — integration/e2e tests use testcontainers for those.
# This file holds only the deltas between CI and the dev stack, so there is a
# single source of truth for the shared infra (see docker-compose.yml).
services:
  ollama:
    # Bind-mount a host cache dir so CI can cache/persist pulled models
    # across workflow runs (docker-compose.override.yml keeps the dev named volume).
    volumes:
      - ./.ollama_cache:/root/.ollama

  clickhouse:
    # More generous startup retries on cold CI runners.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
