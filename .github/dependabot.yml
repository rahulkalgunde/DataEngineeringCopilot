# Keep third-party GitHub Actions SHA-pinned and current.
# Full-commit-SHA pins are resolved by pinact/ratchet; Dependabot opens PRs
# to bump them (SHA + trailing version comment together).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"