repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-symlinks
      - id: check-ast
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-push-to-main
        name: Block direct push to main/master
        entry: 'while read local_ref local_sha remote_ref remote_sha; do branch="${remote_ref##*/}"; if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then echo "Pushing directly to $branch is forbidden. Create a feature branch and open a PR instead."; exit 1; fi; done'
        language: system
        stages: [push]
        always_run: true
        pass_filenames: false
