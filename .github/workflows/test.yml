name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.29"
  COMPOSE_PROJECT_NAME: dec_ci
  UV_PROJECT_ENVIRONMENT: dec_venv
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  LANGFUSE_ENCRYPTION_KEY: ${{ secrets.LANGFUSE_ENCRYPTION_KEY }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run make lint

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history so diff-cover can compare against origin/main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Pre-download NLTK punkt_tab (unit suite blocks outbound network)
        run: uv run python -c "import nltk; nltk.download('punkt_tab')"

      - name: Unit Tests
        run: uv run make test-ci-unit

      - name: Changed-code coverage gate (>=80% on lines touched vs main)
        run: uv run make test-cov-gate

      - name: Total coverage gate (>=80% overall)
        run: uv run make test-cov-total

      - name: Upload coverage
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        if: always()
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  test-eval-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Eval dataset schema gates
        run: uv run make test-eval-data

      - name: Retrieval regression gate
        run: uv run make eval-retrieval-gate

      - name: Stage recall attribution gate
        run: uv run make eval-stage-recall-gate

  test-eval-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: RAG Evaluation
        run: uv run make test-eval

      - name: Reranker smoke
        run: uv run make eval-rerank-smoke

      - name: Prompt-aug smoke
        run: uv run make eval-prompt-aug-smoke

      - name: Pipeline ablation soft-gate
        run: uv run make eval-soft-gate-ablation

      - name: RRF k tuning soft-gate
        run: uv run make eval-soft-gate-tune-k

      - name: RRF weights tuning soft-gate
        run: uv run make eval-soft-gate-tune-weights
